# Unlocks the keyring at login: pam_oo7 holds the GDM password until oo7-daemon collects it. gnome-session pulls this in; Hyprland's target doesn't.
# After= makes autostart apps wait. An app asking first makes D-Bus launch gnome-keyring, which starts locked.
[Unit]
Wants=oo7-daemon.service
After=oo7-daemon.service
